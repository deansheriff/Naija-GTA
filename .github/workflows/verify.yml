name: Verify game server and Docker deployment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: nsl_test
          POSTGRES_USER: nsl
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nsl -d nsl_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run check && npm test && npm run build
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql://nsl:disposable-ci-password@localhost:5432/nsl_test
      - run: docker build -t naija-street-life:test .
      - name: PostgreSQL backup restores all persistent records and protections
        env:
          DATABASE_URL: postgresql://nsl:disposable-ci-password@localhost:5432/nsl_test
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node server/dist/backup-check.js record /tmp/nsl-backup-proof.json
          docker exec "$PG_CONTAINER" pg_dump -U nsl -d nsl_test -Fc --no-owner --no-privileges -f /tmp/nsl-proof.dump
          docker exec "$PG_CONTAINER" createdb -U nsl nsl_restore_ci
          docker exec "$PG_CONTAINER" pg_restore -U nsl --exit-on-error --no-owner --no-privileges -d nsl_restore_ci /tmp/nsl-proof.dump
          DATABASE_URL=postgresql://nsl:disposable-ci-password@localhost:5432/nsl_restore_ci node server/dist/backup-check.js verify /tmp/nsl-backup-proof.json
      - name: Container starts with PostgreSQL and serves the game
        run: |
          docker run -d --name nsl-smoke --network host -e DATABASE_URL=postgresql://nsl:disposable-ci-password@localhost:5432/nsl_test naija-street-life:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8787/api/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8787/api/health
          curl --fail http://localhost:8787/play/ -o /tmp/game.html
          grep -q NSLPrivateStore /tmp/game.html
          curl --fail http://localhost:8787/owner/ -o /tmp/owner.html
          grep -q 'Owner console' /tmp/owner.html
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8787/api/owner/overview)" = 404
          docker stop nsl-smoke
      - name: Compose starts with punctuation in the database password
        env:
          POSTGRES_PASSWORD: 'disposable-ci:@/?#%$[] password'
        run: |
          docker compose up -d --build --wait --wait-timeout 120
          docker compose exec -T app node --input-type=module -e "const r = await fetch('http://localhost:8787/api/health'); const health = await r.json(); if (!r.ok || !health.ok) process.exit(1); const play = await fetch('http://localhost:8787/play/'); if (!play.ok || !(await play.text()).includes('NSLPrivateStore')) process.exit(1);"
      - name: Clean up disposable Compose test stack
        if: always()
        run: docker compose down --volumes
        env:
          POSTGRES_PASSWORD: 'disposable-ci:@/?#%$[] password'
