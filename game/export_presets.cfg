[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*,assets/street-painted.png,assets/neighbor-walk.png,world/foliage_wind.gdshader"
export_path="../build/web/play/index.html"

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/custom_html_shell="res://web/shell.html"
html/head_include="<meta name=\"description\" content=\"Naija Street Life playable prototype: build your life, shape your street.\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false

[preset.1]
name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*,assets/street-painted.png,assets/neighbor-walk.png,world/foliage_wind.gdshader"
export_path="../build/android/naija-street-life-debug.apk"

[preset.1.options]
custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true
version/code=17
version/name="0.16.0-prototype"
package/unique_name="app.naijastreetlife.prototype"
package/name="Naija Street Life"
package/signed=true
package/show_in_android_tv=false
package/show_in_app_library=true
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=true
